<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GS Suite · Gestión Social</title>
<meta name="theme-color" content="#FF6600"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--or:#FF6600;--or2:#FF8A3D;--gr:#C1C7CE;--bl:#79D1FF;--bg:#FEFEFF;--ink:#1B2430;--mut:#5B6675;--card:#fff;--line:#E3E7EC;--sh:0 2px 10px rgba(27,36,48,.08);--back:linear-gradient(160deg,#FF6600 0%,#FF8A3D 55%,#FFB27A 100%);--win:0 24px 70px rgba(120,45,0,.35),0 2px 0 rgba(255,255,255,.4) inset}
@media(prefers-color-scheme:dark){:root{--bg:#161C25;--ink:#F2F5F8;--mut:#A7B1BD;--card:#1F2733;--line:#2E3948;--sh:none;--back:linear-gradient(160deg,#7A3300 0%,#B34700 60%,#D9631A 100%);--win:0 24px 70px rgba(0,0,0,.55)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flow-root;background:var(--back) fixed;color:var(--ink);font-family:Manrope,"Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(121,209,255,.55),rgba(121,209,255,0) 70%);pointer-events:none}
h1,h2,.nm{font-family:"Open Sans","Segoe UI",Arial,sans-serif}
.win{position:relative;max-width:480px;margin:14px auto;background:var(--bg);border-radius:26px;box-shadow:var(--win);overflow:hidden}
/*BANDA*/.band{background:#DDF2FD;padding:calc(18px + env(safe-area-inset-top)) 18px 70px;min-height:168px;color:var(--ink);position:relative;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
@media(prefers-color-scheme:dark){.scene{filter:brightness(.42) saturate(.9)}.band .ib:not(.p){background:rgba(22,28,37,.72);color:#F2F5F8;border-color:rgba(255,255,255,.2)}}
header{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
header img.lg{height:46px;width:46px;border-radius:13px;box-shadow:0 4px 12px rgba(120,45,0,.3)}
header small.by{font-weight:500;font-size:11.5px;opacity:.9;margin-top:1px}
header h1{font-size:23px;margin:0;line-height:1.1;color:var(--ink)}header small{display:block;color:var(--mut);font-weight:600;font-size:12.5px;margin-top:2px}
.sp{flex:1}.ib{border:1px solid rgba(27,36,48,.16);background:rgba(255,255,255,.78);color:#1B2430;border-radius:12px;min-height:44px;min-width:44px;padding:0 14px;font:700 14px Manrope,sans-serif;cursor:pointer}
.ib.p{background:#fff;border-color:#fff;color:var(--or)}
.body{padding:0 16px 22px;margin-top:-16px;position:relative;z-index:2}
#q{width:100%;min-height:52px;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:0 18px;font:600 16px Manrope,sans-serif;margin:0 0 4px;box-shadow:0 8px 22px rgba(27,36,48,.16)}
#q:focus,.ib:focus-visible,.card:focus-visible,#ed .ib:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
h2{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:20px 2px 10px}
h2:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--or)}
h2.b:before{background:var(--bl)}h2.g:before{background:var(--gr)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--or);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);min-height:80px;transition:transform .12s,box-shadow .12s}
.card.b{border-left-color:var(--bl)}.card.g{border-left-color:var(--gr)}
.card:active{transform:scale(.985)}.card:hover{box-shadow:0 8px 20px rgba(255,102,0,.22);transform:translateY(-1px)}
.card:after{content:"›";margin-left:auto;font-size:28px;line-height:1;color:var(--or);font-weight:700}
.ic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,var(--or),var(--or2));box-shadow:0 4px 10px rgba(255,102,0,.3)}
.ic.b{background:linear-gradient(135deg,#3BA7E0,var(--bl));box-shadow:0 4px 10px rgba(59,167,224,.35)}.ic.g{background:linear-gradient(135deg,#8E98A6,var(--gr));box-shadow:0 4px 10px rgba(142,152,166,.4)}
.tx{min-width:0}.nm{font-weight:700;font-size:16.5px}.ds{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.3}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-top:6px;background:rgba(121,209,255,.3);color:var(--ink)}
.tag.w{background:rgba(255,102,0,.16)}
.empty{color:var(--mut);padding:18px 2px}
#ed{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ed.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){#ed{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font:700 18px "Open Sans",sans-serif}.sheet p{color:var(--mut);font-size:13.5px;margin:0 0 12px}
.sheet .ib{background:var(--card);color:var(--ink);border-color:var(--line)}.sheet .ib.p{background:var(--or);border-color:var(--or);color:#fff}
.row{margin-bottom:12px}.row label{display:block;font-weight:700;font-size:13.5px;margin-bottom:4px}
.row input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 12px;font:500 15px Manrope,sans-serif}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin:22px 0 0;line-height:1.5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:10}
@media(max-width:599px){.win{margin:0;border-radius:0;min-height:100vh;box-shadow:none}}
.card.t{padding:0;overflow:hidden;gap:0;align-items:stretch;min-height:92px;border-left:1px solid var(--line)}
.card.t:after{display:none}
.card.t .th{width:44%;flex:none;min-height:92px;background:var(--bg) right center/cover no-repeat;position:relative}
.card.t .th:after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--or)}
.card.t.b .th:after{background:var(--bl)}.card.t.g .th:after{background:var(--gr)}
.card.t .tx{padding:11px 14px;align-self:center}.card.t .ic{display:none}
.card.t .nm{font-weight:800}
@media(min-width:900px){.win{max-width:820px}#main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.grp>h2{margin-top:16px}
.card.t{flex-direction:column;align-items:stretch}.card.t .th{width:auto;height:92px;min-height:0}
.card.t .th:after{left:0;right:0;top:auto;bottom:0;width:auto;height:5px}.card.t .tx{padding:10px 14px 13px;align-self:stretch}}
</style></head>
<body><div class="win"><div class="band"><svg class="scene" viewBox="0 0 480 168" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF2FD"/><stop offset=".6" stop-color="#FBEFE4"/><stop offset="1" stop-color="#F7DCC6"/></linearGradient></defs><rect width="480" height="168" fill="url(#gsky)"/><circle cx="368" cy="36" r="13" fill="#FFB27A" opacity=".8"/><circle cx="368" cy="36" r="22" fill="#FFB27A" opacity=".25"/><path d="M0 168 L0 118.4 L20 119.4 L40 119.7 L60 119.5 L80 118.6 L100 117.2 L120 115.3 L140 113.1 L160 110.9 L180 108.7 L200 106.7 L220 105.2 L240 104.2 L260 103.9 L280 104.2 L300 105.2 L320 106.7 L340 108.6 L360 110.8 L380 113.1 L400 115.2 L420 117.2 L440 118.6 L460 119.6 L480 119.9 L500 168 Z" fill="#CFEAF8" opacity="0.85"/><path d="M0 168 L0 130.3 L20 133.2 L40 135.5 L60 137.0 L80 137.4 L100 136.9 L120 135.4 L140 133.0 L160 130.2 L180 127.1 L200 124.1 L220 121.6 L240 119.9 L260 119.0 L280 119.2 L300 120.3 L320 122.3 L340 124.8 L360 127.7 L380 130.5 L400 132.9 L420 134.8 L440 135.8 L460 136.0 L480 135.2 L500 168 Z" fill="#F2CDB1" opacity="1"/><path d="M0 168 L0 148.9 L20 147.8 L40 146.2 L60 144.5 L80 143.1 L100 142.0 L120 141.6 L140 141.9 L160 142.9 L180 144.5 L200 146.3 L220 148.2 L240 149.8 L260 150.8 L280 151.0 L300 150.5 L320 149.2 L340 147.4 L360 145.3 L380 143.3 L400 141.7 L420 140.8 L440 140.7 L460 141.4 L480 142.9 L500 168 Z" fill="#EBB48D" opacity="1"/><path d="M340 150 V88 M332 93 H348 M334 101 H346" stroke="#6B5B54" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M396 150 V88 M388 93 H404 M390 101 H402" stroke="#6B5B54" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M452 150 V88 M444 93 H460 M446 101 H458" stroke="#6B5B54" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M348 93 Q368.0 102 388 93" stroke="#6B5B54" stroke-width="1" fill="none" opacity=".85"/><path d="M346 101 Q368.0 110 390 101" stroke="#6B5B54" stroke-width="1" fill="none" opacity=".85"/><path d="M404 93 Q424.0 102 444 93" stroke="#6B5B54" stroke-width="1" fill="none" opacity=".85"/><path d="M402 101 Q424.0 110 446 101" stroke="#6B5B54" stroke-width="1" fill="none" opacity=".85"/><rect x="300" y="134" width="34" height="18" fill="#FBF0E6"/><polygon points="297,134 317.0,124.1 337,134" fill="#E8742A"/><rect x="306.8" y="140.8" width="6.1" height="5.4" rx="1" fill="#F5B58A"/><rect x="320.4" y="140.8" width="6.1" height="5.4" rx="1" fill="#F5B58A"/><path d="M372 152 V132" stroke="#7A6A62" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="372" cy="129.6" rx="7.2" ry="11.2" fill="#8C7B72"/><rect x="410" y="134" width="36" height="19" fill="#FBF0E6"/><polygon points="407,134 428.0,123.55 449,134" fill="#F08A3E"/><rect x="417.2" y="141.2" width="6.5" height="5.7" rx="1" fill="#F5B58A"/><rect x="431.6" y="141.2" width="6.5" height="5.7" rx="1" fill="#F5B58A"/><path d="M466 154 V130" stroke="#B85A24" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="466" cy="127.1" rx="8.6" ry="13.4" fill="#E8742A"/><path d="M240 152 V134" stroke="#C7794A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="240" cy="131.8" rx="6.5" ry="10.1" fill="#EFA06A"/><path d="M256 153 V140" stroke="#7A6A62" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="256" cy="138.4" rx="4.7" ry="7.3" fill="#8C7B72"/></svg>
<header><img class="lg" src="mark-white.svg" alt="GS Suite" width="46" height="46"><div><h1>GS Suite</h1><small>Gestión Social · Herramientas digitales</small><small class="by">Desarrollado por Heidi Díaz</small></div><span class="sp"></span><button class="ib p" id="inst" hidden>Instalar</button><button class="ib" id="cfg" aria-label="Editar direcciones">⚙</button></header></div>
<div class="body"><input id="q" type="search" placeholder="Buscar aplicación…" autocomplete="off" aria-label="Buscar aplicación">
<main id="main"></main>
<p class="foot" id="foot"></p>
</div></div>
<div id="ed" role="dialog" aria-modal="true"><div class="sheet"><h3>Direcciones de las aplicaciones</h3><p>Si una app cambia de dirección, pégala aquí. Se guarda solo en este dispositivo. Déjala vacía para volver a la dirección original.</p><div id="rows"></div><div class="acts"><button class="ib" id="rst">Restablecer todo</button><button class="ib" id="cls">Cerrar</button><button class="ib p" id="sav">Guardar</button></div></div></div>
<div id="toast"></div>
<script>
/* ===== Catálogo de aplicaciones. Para agregar una app: añade una línea aquí. =====
   url: dirección por defecto.  */
var GRUPOS=[
 {t:'Campo',apps:[
  {id:'diag',n:'GS Diagnósticos',d:'Visitas de campo, UNC, CD, suspensiones, informe Word y NITS.',i:'🧭',c:'',u:'https://gsdiagnosticosapp.vercel.app/'},
  {id:'ap',n:'GS Alumbrado Público',d:'Inventario de alumbrado público en campo, con programación por cuadrilla (funciona sin conexión).',i:'💡',c:'',u:'https://alumbradopublico.vercel.app/'},
  {id:'docs',n:'GS Docs',d:'Formatos ESPT / GSOCIAL: E1, E6, AR, DJ, RETIE, firmas y exportación.',i:'📄',c:'',u:'https://gsdocumentos.vercel.app/'}]},
 {t:'Documentos y edición',k:'g',apps:[
  {id:'firmas',n:'GS Firmas',d:'Firma única de líderes comunales aplicada a los 5 documentos.',i:'✍️',c:'g',u:'https://gsdocumentos.vercel.app/gs-firmas/'},
  {id:'editor',n:'GS Editor',d:'Control de calidad y corrección de paquetes ZIP de GS Docs.',i:'🛠️',c:'g',u:'https://gsdocumentos.vercel.app/editor-pc/',pc:1},
  {id:'studio',n:'GS Studio',d:'Escanear documentos, firmar y editar PDF.',i:'📷',c:'g',u:'https://gsstudio.vercel.app/'}]}
];
var KEY='gs_suite_urls_v1',$=function(s){return document.querySelector(s)};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){toast('No se pudo guardar en este dispositivo')}}
function url(a){var o=load();return (o[a.ref||a.id]||'').trim()||a.u}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function render(){
  var q=$('#q').value.trim().toLowerCase(),h='',n=0;
  GRUPOS.forEach(function(g){
    var l=g.apps.filter(function(a){return !q||(a.n+' '+a.d).toLowerCase().indexOf(q)>-1});
    if(!l.length)return; n+=l.length;
    h+='<section class="grp"><h2 class="'+(g.k||'')+'">'+esc(g.t)+'</h2><div class="grid">'+l.map(function(a){
      var u=url(a),pending=a.chk&&!load()[a.ref||a.id];
      var A={'diag': 'Diagnosticos', 'ap': 'Alumbrado_Publico', 'docs_campo': 'Docs', 'docs': 'Docs', 'firmas': 'Firmas', 'editor': 'Editor', 'studio': 'Studio'};return '<a class="card t '+a.c+'" href="'+esc(u)+'" data-id="'+a.id+'"><span class="th" style="--bg:url(art-'+A[a.id]+'.webp)" aria-hidden="true"></span><span class="tx"><div class="nm">'+esc(a.n)+'</div><div class="ds">'+esc(a.d)+'</div>'+(a.pc?'<span class="tag">Mejor en computador</span>':'')+(pending?' <span class="tag w" title="Si no abre, pulsa ⚙ y pega la dirección real">Dirección por confirmar</span>':'')+'</span></a>'}).join('')+'</div></section>';
  });
  $('#main').innerHTML=n?h:'<p class="empty">No hay aplicaciones que coincidan.</p>';
  $('#foot').textContent=navigator.onLine?'Con conexión · las apps se actualizan solas al abrirlas.':'Sin conexión · las apps ya abiertas antes siguen funcionando.';
}
$('#q').addEventListener('input',function(){render()});
window.addEventListener('online',function(){render()});window.addEventListener('offline',function(){render()});
function openEd(){var o=load();$('#rows').innerHTML=GRUPOS.reduce(function(a,g){return a.concat(g.apps)},[]).filter(function(a){return !a.ref}).map(function(a){return '<div class="row"><label for="u_'+a.id+'">'+esc(a.n)+'</label><input id="u_'+a.id+'" data-id="'+a.id+'" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="'+esc(a.u)+'" value="'+esc(o[a.id]||'')+'"></div>'}).join('');$('#ed').classList.add('on')}
$('#cfg').onclick=openEd;$('#cls').onclick=function(){$('#ed').classList.remove('on')};
$('#sav').onclick=function(){var o={},bad=0;document.querySelectorAll('#rows input').forEach(function(i){var v=i.value.trim();if(!v)return;if(v.indexOf('http')!==0&&v.charAt(0)!=='/'){if(/^[\w.-]+\.[a-z]{2,}/i.test(v))v='https://'+v;else{bad++;return}}o[i.dataset.id]=v});if(bad){toast('Hay una dirección que no parece válida');return}save(o);$('#ed').classList.remove('on');render();toast('Direcciones guardadas')};
$('#rst').onclick=function(){save({});openEd();render();toast('Direcciones originales restablecidas')};
var dp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;$('#inst').hidden=true})};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
/* Ajuste a la pantalla: la ventana se dimensiona al contenido y, si la pantalla es pequeña (portátil de 14"), el contenido se reduce para verse completo sin barra de desplazamiento. */
function fit(){
  try{
    var w=document.querySelector('.win');if(!w)return;
    w.style.zoom=1;
    if(innerWidth<600)return;
    var nat=w.offsetHeight,avail=innerHeight-28;
    var z=nat>avail?Math.max(.6,avail/nat):1;w.style.zoom=z;
    var sh=document.scrollingElement.scrollHeight;
    if(z<1&&sh>innerHeight){z=Math.max(.55,z*(innerHeight-2)/sh);w.style.zoom=z}
  }catch(e){}
}
function sizeWindow(){
  try{
    if(!matchMedia('(display-mode: standalone)').matches||screen.availWidth<900)return;
    var dW=outerWidth-innerWidth,dH=outerHeight-innerHeight;
    var tw=Math.min(840,screen.availWidth-40)+dW;
    window.resizeTo(tw,Math.min(outerHeight,screen.availHeight-24));
    setTimeout(function(){
      var w=document.querySelector('.win');w.style.zoom=1;
      var th=Math.min(w.offsetHeight+28+dH,screen.availHeight-24);
      window.resizeTo(tw,th);
      window.moveTo(Math.round((screen.availWidth-tw)/2),Math.max(0,Math.round((screen.availHeight-th)/2)));
      fit();
    },200);
  }catch(e){}
}
var _r=render;render=function(){_r();fit()};
window.addEventListener('resize',fit);
render();
setTimeout(function(){sizeWindow();fit()},250);
</script></body></html>
